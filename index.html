<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flip Flashcard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Flip Flashcard</h1>
  <p class="hint">Click the card to flip it</p>

  <div class="card" tabindex="0">
    <div class="card-inner">

      <div class="card-front">
        <h2>Question</h2>
        <p>What language runs in every web browser?</p>
      </div>

      <div class="card-back">
        <h2>Answer</h2>
        <p>JavaScript</p>
      </div>

    </div>
  </div>

</body>
</html>
